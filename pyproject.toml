[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hemomesh"
version = "0.1.0"
description = "Calibrated uncertainty and selective deferral for coronary wall-shear-stress surrogates."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lawson Darrow" }]
dependencies = [
  "h5py>=3.10",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
torch = [
  "torch>=2.1",
  "torch-geometric>=2.4",
]
analysis = [
  "matplotlib>=3.8",
  "pandas>=2.0",
  "seaborn>=0.13",
]

[project.scripts]
hemomesh-inspect = "hemomesh.data.suk:main"
hemomesh-log-baseline = "hemomesh.baselines.reproduce_suk:main"
hemomesh-m1-dataset-eda = "scripts.m1_dataset_eda:main"
hemomesh-train = "hemomesh.train:main"

[tool.setuptools.packages.find]
include = ["hemomesh*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
